<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>人物动态增强 - 背景晃动特效</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 950px;
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 24px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 8px;
            font-size: 1.8rem;
            letter-spacing: 1px;
        }

        .subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 24px;
            font-size: 0.9rem;
        }

        .upload-area {
            background: rgba(255, 255, 255, 0.15);
            border: 2px dashed rgba(255, 255, 255, 0.4);
            border-radius: 24px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 24px;
        }

        .upload-area:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.8);
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .upload-text {
            color: white;
            font-size: 1rem;
        }

        .upload-hint {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.8rem;
            margin-top: 8px;
        }

        input[type="file"] {
            display: none;
        }

        .controls {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 20px;
            padding: 16px 20px;
            margin-bottom: 24px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
            justify-content: space-between;
        }

        .control-group {
            flex: 1;
            min-width: 130px;
        }

        .control-group label {
            display: block;
            color: white;
            font-size: 0.75rem;
            margin-bottom: 6px;
            font-weight: 500;
        }

        input[type="range"] {
            width: 100%;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.3);
            height: 4px;
            border-radius: 5px;
            -webkit-appearance: none;
        }

        input[type="range"]:focus {
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #ff6b6b;
            cursor: pointer;
        }

        .value-display {
            color: #ff6b6b;
            font-size: 0.7rem;
            margin-top: 4px;
            text-align: right;
        }

        .toggle-btn {
            background: rgba(255, 107, 107, 0.8);
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.85rem;
        }

        .toggle-btn:hover {
            background: #ff6b6b;
            transform: scale(1.02);
        }

        .canvas-container {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 450px;
            position: relative;
        }

        canvas {
            max-width: 100%;
            height: auto;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: block;
            margin: 0 auto;
            cursor: pointer;
        }

        .info {
            margin-top: 16px;
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.75rem;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 16px;
        }

        .download-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 8px 24px;
            border-radius: 40px;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.85rem;
        }

        .download-btn:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        .error-message {
            background: rgba(255, 100, 100, 0.9);
            color: white;
            padding: 12px;
            border-radius: 12px;
            margin-top: 16px;
            text-align: center;
            font-size: 0.85rem;
            display: none;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            display: none;
            z-index: 10;
        }

        .mode-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            justify-content: center;
        }

        .mode-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 6px 16px;
            border-radius: 30px;
            color: white;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        .mode-btn.active {
            background: #ff6b6b;
            border-color: #ff6b6b;
        }

        .mode-btn:hover {
            background: rgba(255, 107, 107, 0.6);
        }

        @media (max-width: 600px) {
            .container {
                padding: 16px;
            }
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            .control-group {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✨ 人物动态增强 ✨</h1>
        <div class="subtitle">人物稳定 | 周边材质晃动 | 让静态图片动起来</div>

        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">🖼️</div>
            <div class="upload-text">点击或拖拽上传图片</div>
            <div class="upload-hint">支持 JPG、PNG、WEBP | 自动识别人物区域</div>
            <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp,image/*">
        </div>

        <div class="mode-selector">
            <button class="mode-btn active" data-mode="auto">🤖 智能识别人物</button>
            <button class="mode-btn" data-mode="center">🎯 中心区域稳定</button>
            <button class="mode-btn" data-mode="edge">🌊 边缘优先晃动</button>
        </div>

        <div class="controls">
            <div class="control-group">
                <label>🌊 晃动强度 <span style="color:#ff6b6b;">(背景晃动)</span></label>
                <input type="range" id="intensitySlider" min="0" max="12" step="0.2" value="3.5">
                <div class="value-display" id="intensityValue">强度: 3.5</div>
            </div>
            <div class="control-group">
                <label>🌀 动态速度</label>
                <input type="range" id="speedSlider" min="0" max="2" step="0.1" value="0.9">
                <div class="value-display" id="speedValue">速度: 0.9</div>
            </div>
            <div class="control-group">
                <label>🎨 人物保护范围</label>
                <input type="range" id="protectionSlider" min="0.5" max="2.5" step="0.05" value="1.2">
                <div class="value-display" id="protectionValue">保护: 1.2</div>
            </div>
            <button class="toggle-btn" id="animateToggle">⏸️ 暂停动态</button>
        </div>

        <div class="canvas-container">
            <canvas id="mainCanvas" width="600" height="400" style="width:100%; height:auto; max-width:600px;"></canvas>
            <div class="loading" id="loadingIndicator">🔍 识别人物中...</div>
        </div>
        <div class="info">
            💡 核心效果：<strong>人物区域保持稳定</strong>，人物周围的背景/材质产生流动晃动感，让静态人物充满动态生命力
        </div>
        <div class="btn-group">
            <button class="download-btn" id="downloadBtn">📹 保存动态视频</button>
            <button class="download-btn" id="resetBtn">🔄 重置人物检测</button>
        </div>
        <div class="error-message" id="errorMessage"></div>
    </div>

    <script>
        // DOM 元素
        const fileInput = document.getElementById('fileInput');
        const uploadArea = document.getElementById('uploadArea');
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const errorMessage = document.getElementById('errorMessage');
        
        const intensitySlider = document.getElementById('intensitySlider');
        const speedSlider = document.getElementById('speedSlider');
        const protectionSlider = document.getElementById('protectionSlider');
        const intensityValue = document.getElementById('intensityValue');
        const speedValue = document.getElementById('speedValue');
        const protectionValue = document.getElementById('protectionValue');
        const animateToggle = document.getElementById('animateToggle');
        const downloadBtn = document.getElementById('downloadBtn');
        const resetBtn = document.getElementById('resetBtn');
        
        // 模式按钮
        const modeBtns = document.querySelectorAll('.mode-btn');
        let currentMode = 'auto'; // auto, center, edge

        // 全局变量
        let originalImage = null;
        let animationId = null;
        let time = 0;
        let isAnimating = true;
        
        let intensity = 3.5;
        let speed = 0.9;
        let protectionSize = 1.2; // 人物保护区域大小
        
        let hasImage = false;
        
        // 人物区域掩码 (存储每个人物像素的权重，0=背景可晃动，1=人物区域不动)
        let personMask = null;
        let maskWidth = 0, maskHeight = 0;
        
        // 显示/隐藏函数
        function showError(msg) {
            errorMessage.textContent = msg;
            errorMessage.style.display = 'block';
            setTimeout(() => {
                errorMessage.style.display = 'none';
            }, 5000);
        }
        
        function hideError() { errorMessage.style.display = 'none'; }
        function showLoading(show) { loadingIndicator.style.display = show ? 'block' : 'none'; }
        
        function updateValueDisplays() {
            intensityValue.innerText = `强度: ${intensity.toFixed(1)}`;
            speedValue.innerText = `速度: ${speed.toFixed(1)}`;
            protectionValue.innerText = `保护: ${protectionSize.toFixed(2)}`;
        }
        
        // 智能识别人物区域（基于边缘检测 + 中心区域假设）
        // 这是一个轻量级的"人物区域"检测算法，检测图像中的人物主体区域
        function detectPersonRegion(imageData, width, height) {
            const pixels = imageData.data;
            // 创建权重掩码：0=可晃动区域，1=人物保护区域
            const mask = new Array(width * height).fill(0);
            
            // 方法1: 肤色检测（简单的人物区域识别）
            // 检测肤色像素，作为人物区域的候选
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const idx = (y * width + x) * 4;
                    const r = pixels[idx];
                    const g = pixels[idx+1];
                    const b = pixels[idx+2];
                    
                    // 简单的肤色检测范围（RGB空间）
                    const isSkin = (r > 95 && g > 40 && b > 20 && 
                                   r > g && r > b && 
                                   Math.abs(r - g) > 15);
                    
                    if (isSkin) {
                        // 肤色区域高概率是人物
                        mask[y * width + x] = 1.0;
                    }
                }
            }
            
            // 方法2: 膨胀操作，让保护区域扩大（让整个人物区域都被保护）
            const expandedMask = [...mask];
            const expandRadius = Math.max(8, Math.floor(Math.min(width, height) * 0.03));
            
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    if (mask[y * width + x] > 0.5) {
                        // 向周围扩散
                        for (let dy = -expandRadius; dy <= expandRadius; dy++) {
                            for (let dx = -expandRadius; dx <= expandRadius; dy++) {
                                const ny = y + dy;
                                const nx = x + dx;
                                if (ny >= 0 && ny < height && nx >= 0 && nx < width) {
                                    const dist = Math.sqrt(dx*dx + dy*dy);
                                    const weight = Math.max(0, 1 - dist / expandRadius);
                                    expandedMask[ny * width + nx] = Math.max(expandedMask[ny * width + nx], weight * 0.8);
                                }
                            }
                        }
                    }
                }
            }
            
            // 如果没有检测到肤色，使用中心区域作为人物区域
            let hasSkin = false;
            for (let i = 0; i < width * height; i++) {
                if (expandedMask[i] > 0.5) {
                    hasSkin = true;
                    break;
                }
            }
            
            if (!hasSkin) {
                // 默认使用中心区域作为人物保护区域
                const centerX = width / 2;
                const centerY = height / 2;
                const protectRadius = Math.min(width, height) * 0.25;
                for (let y = 0; y < height; y++) {
                    for (let x = 0; x < width; x++) {
                        const distToCenter = Math.sqrt((x - centerX)**2 + (y - centerY)**2);
                        const weight = Math.max(0, 1 - distToCenter / protectRadius);
                        expandedMask[y * width + x] = Math.max(expandedMask[y * width + x], weight);
                    }
                }
            }
            
            return expandedMask;
        }
        
        // 根据模式生成人物保护掩码
        async function generatePersonMask(img, width, height, mode) {
            // 创建临时canvas获取像素数据
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = width;
            tempCanvas.height = height;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.drawImage(img, 0, 0, width, height);
            const imgData = tempCtx.getImageData(0, 0, width, height);
            
            let mask = new Array(width * height).fill(0);
            
            if (mode === 'auto') {
                // 智能检测
                mask = detectPersonRegion(imgData, width, height);
            } else if (mode === 'center') {
                // 中心区域稳定模式
                const centerX = width / 2;
                const centerY = height / 2;
                const protectRadius = Math.min(width, height) * 0.3 * protectionSize;
                for (let y = 0; y < height; y++) {
                    for (let x = 0; x < width; x++) {
                        const distToCenter = Math.sqrt((x - centerX)**2 + (y - centerY)**2);
                        const weight = Math.max(0, 1 - distToCenter / protectRadius);
                        mask[y * width + x] = Math.min(1, weight);
                    }
                }
            } else if (mode === 'edge') {
                // 边缘优先晃动模式（中心稳定，边缘晃动）
                const centerX = width / 2;
                const centerY = height / 2;
                const stableRadius = Math.min(width, height) * 0.25;
                for (let y = 0; y < height; y++) {
                    for (let x = 0; x < width; x++) {
                        const distToCenter = Math.sqrt((x - centerX)**2 + (y - centerY)**2);
                        if (distToCenter < stableRadius) {
                            mask[y * width + x] = 1.0; // 中心完全保护
                        } else {
                            // 边缘晃动强度随距离增加
                            const edgeWeight = Math.min(1, (distToCenter - stableRadius) / (stableRadius * 1.5));
                            mask[y * width + x] = 1 - edgeWeight * 0.7;
                        }
                    }
                }
            }
            
            return mask;
        }
        
        // 核心绘制函数：人物区域稳定，背景晃动
        function drawWithPersonStabilization(useCurrentTime = false) {
            if (!originalImage || !ctx || !personMask) return;
            
            try {
                const imgWidth = originalImage.width;
                const imgHeight = originalImage.height;
                
                const maxWidth = 600;
                const maxHeight = 500;
                let drawWidth = imgWidth;
                let drawHeight = imgHeight;
                if (drawWidth > maxWidth) {
                    drawWidth = maxWidth;
                    drawHeight = (imgHeight * maxWidth) / imgWidth;
                }
                if (drawHeight > maxHeight) {
                    drawHeight = maxHeight;
                    drawWidth = (imgWidth * maxHeight) / imgHeight;
                }
                
                drawWidth = Math.floor(drawWidth);
                drawHeight = Math.floor(drawHeight);
                
                if (drawWidth < 1 || drawHeight < 1) throw new Error('图片尺寸异常');
                
                canvas.width = drawWidth;
                canvas.height = drawHeight;
                
                const currentIntensity = intensity;
                const currentSpeed = speed;
                
                let t = useCurrentTime ? time : (performance.now() / 1000) * currentSpeed;
                
                // 创建离屏canvas获取原始像素
                const offCanvas = document.createElement('canvas');
                offCanvas.width = drawWidth;
                offCanvas.height = drawHeight;
                const offCtx = offCanvas.getContext('2d');
                offCtx.drawImage(originalImage, 0, 0, drawWidth, drawHeight);
                const imgData = offCtx.getImageData(0, 0, drawWidth, drawHeight);
                const pixels = imgData.data;
                
                const newImgData = offCtx.createImageData(drawWidth, drawHeight);
                const newPixels = newImgData.data;
                
                // 缩放掩码到当前画布尺寸
                const maskScaleX = maskWidth / drawWidth;
                const maskScaleY = maskHeight / drawHeight;
                
                const maxOffsetLimit = Math.min(currentIntensity * 0.8, 8);
                
                // 逐像素处理
                for (let y = 0; y < drawHeight; y++) {
                    const ny = y / drawHeight;
                    for (let x = 0; x < drawWidth; x++) {
                        const nx = x / drawWidth;
                        
                        // 获取当前像素的人物保护权重
                        const maskX = Math.min(Math.floor(x * maskScaleX), maskWidth - 1);
                        const maskY = Math.min(Math.floor(y * maskScaleY), maskHeight - 1);
                        const personWeight = personMask[maskY * maskWidth + maskX];
                        
                        // 晃动偏移计算（只在非人物区域生效）
                        // 人物区域偏移量为0，背景区域产生晃动
                        const shakeFactor = 1 - Math.min(1, personWeight * 1.2);
                        
                        // 多层波动算法，产生自然的背景流动感
                        const wave1X = Math.sin(nx * Math.PI * 1.5 + t * 0.8) * Math.cos(ny * Math.PI * 1.8 + t * 0.6);
                        const wave1Y = Math.cos(ny * Math.PI * 1.6 + t * 0.7) * Math.sin(nx * Math.PI * 1.4 + t * 0.9);
                        
                        const wave2X = Math.sin(nx * Math.PI * 3.2 + t * 1.3) * Math.cos(ny * Math.PI * 2.5 + t * 1.1);
                        const wave2Y = Math.cos(ny * Math.PI * 3.5 + t * 1.2) * Math.sin(nx * Math.PI * 2.8 + t * 1.4);
                        
                        const wave3X = Math.sin(x * 0.06 + t * 1.6) * Math.cos(y * 0.05 + t * 1.3);
                        const wave3Y = Math.cos(y * 0.07 + t * 1.5) * Math.sin(x * 0.055 + t * 1.7);
                        
                        let offsetX = (wave1X * 0.5 + wave2X * 0.3 + wave3X * 0.2) * currentIntensity * 0.3;
                        let offsetY = (wave1Y * 0.5 + wave2Y * 0.3 + wave3Y * 0.2) * currentIntensity * 0.3;
                        
                        // 边缘衰减，让边界过渡自然
                        const edgeFactorX = 1 - Math.pow(Math.abs(nx - 0.5) * 1.2, 2);
                        const edgeFactorY = 1 - Math.pow(Math.abs(ny - 0.5) * 1.2, 2);
                        const edgeFactor = Math.min(edgeFactorX, edgeFactorY) * 0.7 + 0.3;
                        
                        // 应用人物保护权重：人物区域几乎没有偏移
                        offsetX *= shakeFactor * edgeFactor;
                        offsetY *= shakeFactor * edgeFactor;
                        
                        offsetX = Math.min(Math.max(offsetX, -maxOffsetLimit), maxOffsetLimit);
                        offsetY = Math.min(Math.max(offsetY, -maxOffsetLimit), maxOffsetLimit);
                        
                        let srcX = x + offsetX;
                        let srcY = y + offsetY;
                        
                        srcX = Math.min(Math.max(srcX, 0), drawWidth - 1);
                        srcY = Math.min(Math.max(srcY, 0), drawHeight - 1);
                        
                        const srcIdx = (Math.floor(srcY) * drawWidth + Math.floor(srcX)) * 4;
                        const dstIdx = (y * drawWidth + x) * 4;
                        
                        newPixels[dstIdx] = pixels[srcIdx];
                        newPixels[dstIdx+1] = pixels[srcIdx+1];
                        newPixels[dstIdx+2] = pixels[srcIdx+2];
                        newPixels[dstIdx+3] = pixels[srcIdx+3];
                    }
                }
                
                ctx.putImageData(newImgData, 0, 0);
            } catch (err) {
                console.error('绘制错误:', err);
            }
        }
        
        function animate() {
            if (!isAnimating) {
                if (hasImage && originalImage && personMask) {
                    drawWithPersonStabilization(true);
                }
                animationId = requestAnimationFrame(animate);
                return;
            }
            
            if (!hasImage || !originalImage || !personMask) {
                animationId = requestAnimationFrame(animate);
                return;
            }
            
            time += 0.016 * speed;
            if (time > Math.PI * 10) time = 0;
            
            drawWithPersonStabilization(true);
            
            animationId = requestAnimationFrame(animate);
        }
        
        function startAnimation() {
            if (animationId) cancelAnimationFrame(animationId);
            animationId = requestAnimationFrame(animate);
        }
        
        // 加载并处理图片
        async function loadImage(file) {
            hideError();
            if (!file) {
                showError('请选择图片文件');
                return;
            }
            
            if (!file.type.match('image.*')) {
                showError('请上传图片文件（JPG、PNG、WEBP等格式）');
                return;
            }
            
            showLoading(true);
            
            try {
                const dataUrl = await new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve(e.target.result);
                    reader.onerror = () => reject(new Error('文件读取失败'));
                    reader.readAsDataURL(file);
                });
                
                const img = await new Promise((resolve, reject) => {
                    const image = new Image();
                    image.onload = () => resolve(image);
                    image.onerror = () => reject(new Error('图片加载失败'));
                    image.src = dataUrl;
                });
                
                if (img.width === 0 || img.height === 0) throw new Error('图片尺寸无效');
                
                originalImage = img;
                
                // 生成人物掩码
                const analysisWidth = 200; // 降低分辨率加速检测
                const analysisHeight = Math.floor((img.height / img.width) * analysisWidth);
                
                showLoading(true);
                loadingIndicator.textContent = '🎭 分析人物区域中...';
                
                personMask = await generatePersonMask(img, analysisWidth, analysisHeight, currentMode);
                maskWidth = analysisWidth;
                maskHeight = analysisHeight;
                
                hasImage = true;
                time = 0;
                
                if (!isAnimating) {
                    isAnimating = true;
                    animateToggle.innerText = "⏸️ 暂停动态";
                }
                
                drawWithPersonStabilization(true);
                
                if (animationId) cancelAnimationFrame(animationId);
                startAnimation();
                
                showLoading(false);
                loadingIndicator.textContent = '🔍 识别人物中...';
                
            } catch (err) {
                console.error('加载错误:', err);
                showError('图片处理失败: ' + err.message);
                showLoading(false);
                hasImage = false;
                originalImage = null;
                personMask = null;
                drawPlaceholder();
            }
        }
        
        // 重新生成掩码（用于模式切换或重置）
        async function regenerateMask() {
            if (!originalImage) return;
            
            showLoading(true);
            loadingIndicator.textContent = '🎭 重新分析人物区域...';
            
            try {
                const analysisWidth = 200;
                const analysisHeight = Math.floor((originalImage.height / originalImage.width) * analysisWidth);
                personMask = await generatePersonMask(originalImage, analysisWidth, analysisHeight, currentMode);
                maskWidth = analysisWidth;
                maskHeight = analysisHeight;
                
                if (hasImage) {
                    drawWithPersonStabilization(true);
                }
            } catch (err) {
                showError('人物检测失败: ' + err.message);
            }
            
            showLoading(false);
            loadingIndicator.textContent = '🔍 识别人物中...';
        }
        
        // 模式切换
        modeBtns.forEach(btn => {
            btn.addEventListener('click', async () => {
                modeBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentMode = btn.dataset.mode;
                if (originalImage) {
                    await regenerateMask();
                }
            });
        });
        
        // 重置人物检测
        resetBtn.addEventListener('click', async () => {
            if (originalImage) {
                await regenerateMask();
                showError('');
                const tempMsg = document.createElement('div');
                tempMsg.style.position = 'fixed';
                tempMsg.style.bottom = '20px';
                tempMsg.style.left = '50%';
                tempMsg.style.transform = 'translateX(-50%)';
                tempMsg.style.background = '#4caf50';
                tempMsg.style.color = 'white';
                tempMsg.style.padding = '8px 16px';
                tempMsg.style.borderRadius = '20px';
                tempMsg.style.fontSize = '0.8rem';
                tempMsg.style.zIndex = '1000';
                tempMsg.textContent = '✅ 人物区域已重新检测';
                document.body.appendChild(tempMsg);
                setTimeout(() => tempMsg.remove(), 2000);
            }
        });
        
        // 事件监听
        uploadArea.addEventListener('click', () => fileInput.click());
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.style.background = 'rgba(255,255,255,0.3)';
        });
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.style.background = 'rgba(255,255,255,0.15)';
        });
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.style.background = 'rgba(255,255,255,0.15)';
            const file = e.dataTransfer.files[0];
            if (file) loadImage(file);
        });
        
        fileInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files[0]) {
                loadImage(e.target.files[0]);
            }
        });
        
        intensitySlider.addEventListener('input', () => {
            intensity = parseFloat(intensitySlider.value);
            updateValueDisplays();
            if (hasImage) drawWithPersonStabilization(true);
        });
        
        speedSlider.addEventListener('input', () => {
            speed = parseFloat(speedSlider.value);
            updateValueDisplays();
        });
        
        protectionSlider.addEventListener('input', () => {
            protectionSize = parseFloat(protectionSlider.value);
            updateValueDisplays();
            if (originalImage && currentMode !== 'auto') {
                regenerateMask();
            }
        });
        
        animateToggle.addEventListener('click', () => {
            isAnimating = !isAnimating;
            animateToggle.innerText = isAnimating ? "⏸️ 暂停动态" : "▶️ 启动动态";
        });
        
        downloadBtn.addEventListener('click', async () => {
            if (!hasImage || !originalImage) {
                showError('请先上传一张图片');
                return;
            }
            try {
                const stream = canvas.captureStream(30);
                const mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
                let chunks = [];
                mediaRecorder.ondataavailable = (e) => chunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const blob = new Blob(chunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `person_enhance_${Date.now()}.webm`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                };
                mediaRecorder.start();
                setTimeout(() => mediaRecorder.stop(), 2500);
            } catch (err) {
                showError('录制失败: ' + err.message);
            }
        });
        
        function drawPlaceholder() {
            canvas.width = 600;
            canvas.height = 400;
            ctx.fillStyle = '#2c3e66';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'white';
            ctx.font = '16px system-ui';
            ctx.textAlign = 'center';
            ctx.fillText('⬆️ 上传带人物的图片 ⬆️', canvas.width/2, canvas.height/2);
            ctx.font = '12px system-ui';
            ctx.fillStyle = '#ccc';
            ctx.fillText('人物区域保持稳定 | 周边背景产生流动晃动', canvas.width/2, canvas.height/2 + 35);
        }
        
        drawPlaceholder();
        updateValueDisplays();
    </script>
</body>
</html>
